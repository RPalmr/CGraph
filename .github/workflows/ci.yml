name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.' pytest networkx ruff build
      - run: ruff check src tests examples benchmarks scripts
      - run: ruff format --check src tests examples benchmarks scripts
      - run: pytest -q
      - run: python -m build
      - run: python scripts/verify_release.py
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: python -c "from cgraph import DAG, identify; assert identify(DAG(('t','y'),(('t','y'),)), treatment='t', outcome='y').status == 'identified'"
